<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sternenfänger</title>
<link rel="stylesheet" href="hub-ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="hub-ui">
<div class="stage" id="stage">
  <canvas id="game" tabindex="-1" role="img" aria-label="Spielfeld: Sterne und Meteoriten fallen von oben, unten fängt deine Schale."></canvas>
  <button class="pause" id="pause" type="button" aria-label="Pause" hidden><span aria-hidden="true">❚❚</span></button>
  <p class="sr-only" id="live" role="status"></p>

  <section class="panel" id="panel" aria-labelledby="title">
    <div class="panel-main">
      <header class="panel-head">
        <p class="hub-eyebrow" id="where">Sternenfänger</p>
        <h1 id="title">Sternenfänger</h1>
        <p class="message" id="message">Verbinde mit dem Hub …</p>
      </header>
      <p class="hub-muted small save-state" id="save-state" role="status"></p>
      <p class="mode-note" id="mode-note" hidden></p>
      <button class="hub-btn hub-primary hub-big play" id="play" type="button" disabled>Spielen</button>
      <dl class="facts">
        <div><dt>Rekord</dt><dd id="record">–</dd></div>
        <div><dt>Level</dt><dd id="best-level" title="Bestes Level, das du erreicht hast">–</dd></div>
        <div><dt>Modus</dt><dd id="difficulty">–</dd></div>
      </dl>
      <p class="hub-muted small hint">Ziehen mit Finger oder Maus · Pfeiltasten · P pausiert</p>
    </div>
    <div class="panel-more">
      <section class="block" aria-labelledby="h-board">
        <h2 id="h-board">Bestenliste</h2>
        <ol class="hub-leaderboard" id="board"></ol>
        <p class="hub-muted small" id="board-empty" hidden>Noch niemand – sei die oder der Erste!</p>
      </section>
      <section class="block" aria-labelledby="h-ach">
        <h2 id="h-ach">Erfolge</h2>
        <ul class="achievements" id="achievements"></ul>
        <p class="hub-muted small" id="ach-empty" hidden>Erfolge siehst du, wenn das Spiel im Hub läuft.</p>
      </section>
    </div>
  </section>
</div>
<div class="hub-toast" id="toast" role="status" hidden></div>
<script src="hub-sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
